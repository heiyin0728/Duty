<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="QEH OnDuty" />
  <title>QEH Watch OnDuty</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang HK", sans-serif;
      overflow: hidden;
      touch-action: pan-y;
    }
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      padding: 4px 6px 6px;
      justify-content: space-between;
    }

    /* 頂部狀態列：時間 + 雲端點 + 點擊回實時當更 */
    .watch-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 4px;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      flex-shrink: 0;
    }
    .sync-dot.warn { background: #f59e0b; }
    .date-tag {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      white-space: nowrap;
    }
    .live-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 99px;
      background: #064e3b;
      color: #34d399;
      border: 1px solid #059669;
    }
    .live-badge.offset {
      background: #451a03;
      color: #fbbf24;
      border-color: #d97706;
      cursor: pointer;
    }
    .clock-text {
      font-size: 13px;
      font-weight: 800;
      color: #5eead4;
      font-variant-numeric: tabular-nums;
    }

    /* 更期主標題列（支援點擊左右箭頭輔助切換） */
    .shift-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f766e;
      border-radius: 10px;
      padding: 5px 8px;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .shift-banner.night { background: #3730a3; }
    .shift-banner.past-future { background: #1e293b; border: 1px solid #334155; }
    .shift-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }
    .shift-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .shift-count {
      font-size: 11px;
      font-weight: 700;
      color: #ccfbf1;
      background: rgba(0, 0, 0, 0.28);
      padding: 1px 6px;
      border-radius: 99px;
    }
    .nav-arrows {
      display: flex;
      gap: 4px;
    }
    .arrow-btn {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: none;
      border-radius: 6px;
      width: 24px;
      height: 22px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .arrow-btn:active { background: rgba(255, 255, 255, 0.35); }

    /* 滑動內容區 */
    .swipe-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 5px 0 2px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      -webkit-overflow-scrolling: touch;
    }
    .swipe-viewport::-webkit-scrollbar { display: none; }

    @keyframes slideFromRight {
      from { opacity: 0.35; transform: translateX(22px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideFromLeft {
      from { opacity: 0.35; transform: translateX(-22px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .anim-next { animation: slideFromRight 0.18s ease-out; }
    .anim-prev { animation: slideFromLeft 0.18s ease-out; }

    /* 人員卡片（大字體適合 Watch 一眼看清） */
    .staff-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 6px 9px;
      min-height: 36px;
    }
    .staff-row.st-meal {
      background: #271a03;
      border-color: #b45309;
    }
    .staff-row.st-not-started {
      background: #0c192e;
      border-color: #1d4ed8;
    }
    .staff-row.st-off-work {
      opacity: 0.55;
    }
    .staff-left {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }
    .staff-name {
      font-size: 16px;
      font-weight: 800;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-tag {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .status-tag.meal { background: #f59e0b; color: #000; }
    .status-tag.not-started { background: #3b82f6; color: #fff; }
    .status-tag.off-work { background: #334155; color: #cbd5e1; }
    .status-tag.pu-sub { background: #0284c7; color: #fff; }

    .duty-pill {
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      background: #134e4a;
      color: #5eead4;
      border: 1px solid #0d9488;
      flex-shrink: 0;
    }
    .duty-pill.night {
      background: #312e81;
      color: #c7d2fe;
      border-color: #6366f1;
    }
    .duty-pill.mid {
      background: #164e63;
      color: #a5f3fc;
      border-color: #06b6d4;
    }

    /* 中更分隔小標 */
    .mid-divider {
      font-size: 11px;
      font-weight: 800;
      color: #22d3ee;
      padding: 2px 4px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .empty-msg {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      padding: 18px 0;
    }

    /* 底部滑動提示點 */
    .watch-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 3px;
      font-size: 10px;
      color: #64748b;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="app-shell" id="watch-root">
    <!-- 頂部狀態列 -->
    <div class="watch-header" onclick="resetToLiveShift()" title="點擊回到實時當更">
      <div class="header-left">
        <span id="sync-dot" class="sync-dot"></span>
        <span id="header-date" class="date-tag">--/-- (--)</span>
        <span id="live-status-pill" class="live-badge">實時當更</span>
      </div>
      <span id="header-clock" class="clock-text">--:--</span>
    </div>

    <!-- 更期標題列 -->
    <div id="shift-banner" class="shift-banner">
      <div class="shift-title-wrap">
        <span id="shift-title" class="shift-title">A Duty</span>
        <span id="shift-count" class="shift-count">0人</span>
      </div>
      <div class="nav-arrows">
        <button class="arrow-btn" onclick="stepShift(-1)" aria-label="上一更">‹</button>
        <button class="arrow-btn" onclick="stepShift(1)" aria-label="下一更">›</button>
      </div>
    </div>

    <!-- 人員名單滑動區 -->
    <div id="staff-list-viewport" class="swipe-viewport"></div>

    <!-- 底部手勢提示 -->
    <div class="watch-footer">
      <span>→ 右滑上更</span>
      <span id="sync-label">☁ 同步中</span>
      <span>左滑下更 ←</span>
    </div>
  </div>

  <script>
    const CLOUD_DB_ENDPOINT = '/api/duty-db';
    const STORAGE_KEY = 'qeh_aed_duty_v26';
    const WATCH_CACHE_KEY = 'qeh_watch_onduty_cache_v1';
    const ANCHOR_BASE_MONDAY = '2026-11-16';

    const MASTER_21_ROTATION = [
      '黃詩琪', '李嘉琪', '梅潔瑜', '陳曦彥', '關鉦', '吳愷欣', '吳媛',
      '吳珈翹', '黃愛萍', '王曉雯', '丘飛鵬', '謝玉連', '朱翠君', '張麗',
      '謝小曼', '侯嘉敏', '馮玉琼', '馮嘉錂', '蘇靖珊', '葉曉彤', '黃雅倩'
    ];

    const IMAGE3_DEFAULT_PATTERN = [
      ['SH/替', 'Ec', 'Pu', 'O', 'WO', 'Ad', 'Ae/N'],
      ['Na', 'O', 'Ec', '11-8', 'Ad', 'WO', 'Ac'],
      ['Aa', 'Ne', 'O', 'SH/替', 'Pe', 'Ec', 'WO'],
      ['Ad', 'Aa', 'Ne', 'WO', 'O', 'SH/替', 'Pa'],
      ['11-8', 'WO', 'Aa', 'Ne', 'O', 'Ac', 'Pe'],
      ['Ed', 'SH/替', 'O', 'Aa', 'Ne', 'WO', 'Ad'],
      ['Pa', 'Ed', 'SH/替', 'WO', 'Aa', 'Ne', 'O'],
      ['WO', 'O', 'Ad', 'Ed', '11-8', 'Aa', 'Ne'],
      ['O', 'Pa', '11-8', 'Ad', 'SH/Ac', 'WO', 'Aa/N'],
      ['Ne', 'O', 'WO', 'Pe', 'Pa', 'Ed', 'SH/11-8'],
      ['Ae', 'Na', 'O', 'Pa', 'Ec', '11-8', 'WO'],
      ['WO', 'Ae', 'Na', 'O', 'Ed', 'Pe', 'Pu'],
      ['SH/替', '11-8', 'Ae', 'Na', 'O', 'WO', 'Ec'],
      ['Pe', 'Pu', 'SH/替', 'Ae', 'Na', 'O', 'WO'],
      ['Pu', 'Pe', 'Pe', 'WO', 'Ae', 'Na', 'O'],
      ['Ac', 'Ad', 'Ed', 'WO', 'O', 'Ae', 'Na'],
      ['O', 'SH/替', 'Pa', 'Pu', 'Pu', 'WO', 'Ed'],
      ['O', 'Ed', 'Ac', 'Ad', 'Ac', 'WO', 'Aa'],
      ['Ec', 'Pe', 'Pe', 'WO', 'Ae', 'Na', 'O'],
      ['Pa', 'Ec', 'Pu', 'O', 'WO', 'Ad', 'Ae'],
      ['11-8', 'WO', 'Aa', 'Ne', 'O', 'Ac', 'Pe']
    ];

    const DUTY_SPEC_MAP = {
      'Aa': { workStartMin: 420, workEndMin: 903, mealStartMin: 600, mealEndMin: 630 },
      'Ac': { workStartMin: 420, workEndMin: 948, mealStartMin: 720, mealEndMin: 780 },
      'Ad': { workStartMin: 420, workEndMin: 948, mealStartMin: 780, mealEndMin: 840 },
      'Ae': { workStartMin: 420, workEndMin: 903, mealStartMin: 570, mealEndMin: 600 },
      '9/5': { workStartMin: 540, workEndMin: 1068, mealStartMin: 780, mealEndMin: 840 },
      '9-6': { workStartMin: 540, workEndMin: 1068, mealStartMin: 780, mealEndMin: 840 },
      '11/8': { workStartMin: 675, workEndMin: 1203, mealStartMin: 1020, mealEndMin: 1080 },
      '11-8': { workStartMin: 675, workEndMin: 1203, mealStartMin: 1020, mealEndMin: 1080 },
      'Pa': { workStartMin: 825, workEndMin: 1353, mealStartMin: 1140, mealEndMin: 1200 },
      'Pe': { workStartMin: 825, workEndMin: 1353, mealStartMin: 1080, mealEndMin: 1140 },
      'Pu': { workStartMin: 825, workEndMin: 1353, mealStartMin: 1080, mealEndMin: 1140 },
      'Ec': { workStartMin: 855, workEndMin: 1383, mealStartMin: 1140, mealEndMin: 1200 },
      'Ed': { workStartMin: 855, workEndMin: 1383, mealStartMin: 1200, mealEndMin: 1260 },
      'Na': { workStartMin: 1350, workEndMin: 438, mealStartMin: 90, mealEndMin: 180 },
      'Ne': { workStartMin: 1350, workEndMin: 438, mealStartMin: 210, mealEndMin: 300 }
    };

    let state = {
      weeks: {},
      al2026Rows: [],
      al2027Rows: [],
      puSubNotes: {},
      mealSwapsByDate: {},
      shiftOffset: 0 // 0 = 實時當更, +1 = 下更, -1 = 上更
    };

    // --- 日期工具 ---
    function parseLocalDate(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function formatLocalDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function addDays(dateStr, days) {
      const d = parseLocalDate(dateStr);
      d.setDate(d.getDate() + days);
      return formatLocalDate(d);
    }
    function getMonday(dateStr) {
      const d = parseLocalDate(dateStr);
      const day = d.getDay();
      d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
      return formatLocalDate(d);
    }

    // --- 實時更期計算（與主系統一致） ---
    function getLiveShiftBase(now = new Date()) {
      const mins = now.getHours() * 60 + now.getMinutes();
      const todayStr = formatLocalDate(now);
      if (mins >= 420 && mins < 948) return { dateStr: todayStr, slot: 'A' };
      if (mins >= 948 && mins < 1350) return { dateStr: todayStr, slot: 'P' };
      if (mins < 420) return { dateStr: addDays(todayStr, -1), slot: 'N' };
      return { dateStr: todayStr, slot: 'N' };
    }

    function getTargetShiftByOffset(offset) {
      const base = getLiveShiftBase(new Date());
      const slots = ['A', 'P', 'N'];
      const baseIdx = slots.indexOf(base.slot);
      const totalIdx = baseIdx + offset;
      const dayShift = Math.floor(totalIdx / 3);
      const slotIdx = ((totalIdx % 3) + 3) % 3;
      return {
        dateStr: addDays(base.dateStr, dayShift),
        slot: slots[slotIdx]
      };
    }

    // --- 更期代碼標準化與推算 ---
    function unwrapBracket(c) {
      const s = (c || '').trim();
      return (s.startsWith('[') && s.endsWith(']') && s.length >= 3) ? s.slice(1, -1).trim() : s;
    }
    function hasBrackets(c) {
      const s = (c || '').trim();
      return s.startsWith('[') && s.endsWith(']') && s.length >= 3;
    }
    function normalizeCode(raw) {
      let c = unwrapBracket(raw);
      if (!c) return '';
      if (c.includes('/')) {
        const [p0, p1] = c.split('/').map(x => x.trim());
        if ((p1 || '').toUpperCase() === 'N') return (p0.toUpperCase() === 'AE' || p0.toUpperCase() === 'AC') ? 'Ne' : 'Na';
        if (['O', 'WO', 'OW', 'AL', 'SH', 'PH', 'SL'].includes(p0.toUpperCase()) && p1 && p1 !== '替') return p1;
        return p0;
      }
      const map = { 'AA': 'Aa', 'AC': 'Ac', 'AD': 'Ad', 'AE': 'Ae', 'PA': 'Pa', 'PE': 'Pe', 'PU': 'Pu', 'EC': 'Ec', 'ED': 'Ed', 'NA': 'Na', 'NE': 'Ne' };
      return map[c.toUpperCase()] || c;
    }

    function getAlOverride(name, dateStr) {
      const d = parseLocalDate(dateStr);
      const dayIdx = (d.getDay() + 6) % 7;
      const allAl = [...(state.al2026Rows || []), ...(state.al2027Rows || [])];
      for (const r of allAl) {
        if (dateStr >= r.startDate && dateStr <= r.endDate && (r.names || []).includes(name)) {
          if (dayIdx <= 4) return 'AL';
          if (dayIdx === 5) return 'WO';
          return 'O';
        }
      }
      return '';
    }

    function getRosterForDate(dateStr) {
      const monday = getMonday(dateStr);
      const d = parseLocalDate(dateStr);
      const dayIdx = (d.getDay() + 6) % 7;
      const weekObj = state.weeks[monday];

      if (weekObj && Array.isArray(weekObj.rows)) {
        // 偵測當日 SL 與 Pu 替更
        let slSlot = '';
        let slStaff = '';
        const presentP = new Set();
        weekObj.rows.forEach((r, idx) => {
          const code = unwrapBracket(r.duties?.[dayIdx] || '');
          const up = code.toUpperCase();
          if (['PA', 'PE', 'EC', 'ED'].includes(up)) presentP.add(normalizeCode(code));
          if (up === 'SL' || up.startsWith('SL/')) {
            slStaff = r.name;
            const parts = code.split('/');
            if (parts[1]) slSlot = normalizeCode(parts[1]);
            else {
              const sampleC = normalizeCode(IMAGE3_DEFAULT_PATTERN[idx]?.[dayIdx] || '');
              if (['Pa', 'Pe', 'Ec', 'Ed'].includes(sampleC)) slSlot = sampleC;
            }
          }
        });
        if (slStaff && !slSlot) {
          slSlot = ['Pa', 'Ec', 'Ed', 'Pe'].find(s => !presentP.has(s)) || '';
        }

        return weekObj.rows.map((r, idx) => {
          const raw = (r.duties?.[dayIdx] || '').trim();
          if (!r.name || hasBrackets(raw)) return null;
          let code = normalizeCode(raw);
          let puNote = state.puSubNotes[`${dateStr}_${r.name}`] || '';
          if (code === 'Pu' && slStaff && slSlot) {
            code = slSlot;
            puNote = `替${slStaff}`;
          }
          return { row: r.row || idx + 1, name: r.name, code, puNote };
        }).filter(Boolean);
      }

      // 無實際更表時依 21 人輪轉推算
      const weeksDiff = Math.round((parseLocalDate(monday) - parseLocalDate(ANCHOR_BASE_MONDAY)) / (7 * 86400000));
      return MASTER_21_ROTATION.map((name, idx) => {
        if (!name) return null;
        const srcIdx = ((idx - weeksDiff) % 21 + 21) % 21;
        const staffName = MASTER_21_ROTATION[srcIdx];
        if (!staffName) return null;
        const al = getAlOverride(staffName, dateStr);
        const code = al || normalizeCode(IMAGE3_DEFAULT_PATTERN[idx]?.[dayIdx] || '');
        return { row: idx + 1, name: staffName, code, puNote: '' };
      }).filter(Boolean);
    }

    function getLiveStatusBadge(name, code, dateStr, isNightSlot) {
      const now = new Date();
      const todayStr = formatLocalDate(now);
      const yesterdayStr = addDays(todayStr, -1);
      const mins = now.getHours() * 60 + now.getMinutes();
      const spec = DUTY_SPEC_MAP[code];
      if (!spec) return { cls: '', html: '' };

      const swap = state.mealSwapsByDate?.[dateStr]?.[name];
      const mealStart = swap ? swap.mealStartMin : spec.mealStartMin;
      const mealEnd = swap ? swap.mealEndMin : spec.mealEndMin;

      if (isNightSlot) {
        if (dateStr === todayStr) {
          if (mins < spec.workStartMin) return { cls: 'st-not-started', html: '<span class="status-tag not-started">未上班</span>' };
          return { cls: '', html: '' };
        }
        if (dateStr === yesterdayStr) {
          if (mins >= spec.workEndMin) return { cls: 'st-off-work', html: '<span class="status-tag off-work">已放工</span>' };
          if (mins >= mealStart && mins < mealEnd) return { cls: 'st-meal', html: '<span class="status-tag meal">食飯中</span>' };
          return { cls: '', html: '' };
        }
        return dateStr > todayStr
          ? { cls: 'st-not-started', html: '<span class="status-tag not-started">未上班</span>' }
          : { cls: 'st-off-work', html: '<span class="status-tag off-work">已放工</span>' };
      }

      if (dateStr > todayStr) return { cls: 'st-not-started', html: '<span class="status-tag not-started">未上班</span>' };
      if (dateStr < todayStr) return { cls: 'st-off-work', html: '<span class="status-tag off-work">已放工</span>' };
      if (mins < spec.workStartMin) return { cls: 'st-not-started', html: '<span class="status-tag not-started">未上班</span>' };
      if (mins >= spec.workEndMin) return { cls: 'st-off-work', html: '<span class="status-tag off-work">已放工</span>' };
      if (mins >= mealStart && mins < mealEnd) return { cls: 'st-meal', html: '<span class="status-tag meal">食飯中</span>' };
      return { cls: '', html: '' };
    }

    // --- 畫面渲染 ---
    function renderWatchView(animDir = '') {
      const now = new Date();
      document.getElementById('header-clock').textContent =
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const target = getTargetShiftByOffset(state.shiftOffset);
      const dObj = parseLocalDate(target.dateStr);
      const wDays = ['日', '一', '二', '三', '四', '五', '六'];
      document.getElementById('header-date').textContent =
        `${dObj.getMonth() + 1}/${dObj.getDate()} (${wDays[dObj.getDay()]})`;

      const livePill = document.getElementById('live-status-pill');
      if (state.shiftOffset === 0) {
        livePill.textContent = '實時當更';
        livePill.className = 'live-badge';
      } else {
        livePill.textContent = state.shiftOffset > 0 ? `+${state.shiftOffset}更 · 回實時` : `${state.shiftOffset}更 · 回實時`;
        livePill.className = 'live-badge offset';
      }

      const banner = document.getElementById('shift-banner');
      banner.className = 'shift-banner' +
        (target.slot === 'N' ? ' night' : '') +
        (state.shiftOffset !== 0 ? ' past-future' : '');

      const priorityMap = { 'Aa': 1, 'Ac': 2, 'Ad': 3, 'Ae': 4, 'Pa': 1, 'Ec': 2, 'Pe': 3, 'Ed': 4, 'Pu': 5, 'Na': 1, 'Ne': 2, '11-8': 1, '11/8': 1, '9-6': 2, '9/5': 2 };
      const sortFn = (a, b) => (priorityMap[a.code] || 99) - (priorityMap[b.code] || 99) || a.row - b.row;

      let mainList = [];
      let midList = [];
      let isNight = false;

      if (target.slot === 'A') {
        document.getElementById('shift-title').textContent = 'A Duty';
        const dayRoster = getRosterForDate(target.dateStr);
        mainList = dayRoster.filter(p => ['Aa', 'Ac', 'Ad', 'Ae'].includes(p.code)).sort(sortFn);
        midList = dayRoster.filter(p => ['11-8', '11/8', '9-6', '9/5'].includes(p.code)).sort(sortFn);
      } else if (target.slot === 'P') {
        document.getElementById('shift-title').textContent = 'P Duty';
        const dayRoster = getRosterForDate(target.dateStr);
        mainList = dayRoster.filter(p => ['Pa', 'Pe', 'Pu', 'Ec', 'Ed'].includes(p.code)).sort(sortFn);
        midList = dayRoster.filter(p => ['11-8', '11/8', '9-6', '9/5'].includes(p.code)).sort(sortFn);
      } else {
        isNight = true;
        document.getElementById('shift-title').textContent = 'N Duty';
        const nextMorningStr = addDays(target.dateStr, 1);
        const nextRoster = getRosterForDate(nextMorningStr);
        mainList = nextRoster.filter(p => ['Na', 'Ne'].includes(p.code)).sort(sortFn);
      }

      document.getElementById('shift-count').textContent = `${mainList.length}人`;

      const renderRow = (p, pillExtraCls = '') => {
        const st = getLiveStatusBadge(p.name, p.code, target.dateStr, isNight);
        const puBadge = p.puNote ? `<span class="status-tag pu-sub">${p.puNote}</span>` : '';
        return `
          <div class="staff-row ${st.cls}">
            <div class="staff-left">
              <span class="staff-name">${p.name}</span>
              ${st.html}
              ${puBadge}
            </div>
            <span class="duty-pill ${pillExtraCls}">${p.code}</span>
          </div>
        `;
      };

      const viewport = document.getElementById('staff-list-viewport');
      let html = mainList.length
        ? mainList.map(p => renderRow(p, isNight ? 'night' : '')).join('')
        : `<div class="empty-msg">此更期暫無人員</div>`;

      if (midList.length > 0) {
        html += `<div class="mid-divider"><span>中更（11-8 / 9-6）</span><span>${midList.length}人</span></div>`;
        html += midList.map(p => renderRow(p, 'mid')).join('');
      }

      if (animDir) {
        viewport.classList.remove('anim-next', 'anim-prev');
        void viewport.offsetWidth;
        viewport.classList.add(animDir === 'next' ? 'anim-next' : 'anim-prev');
      }
      viewport.innerHTML = html;
      viewport.scrollTop = 0;
    }

    // --- 左右滑動切換上下更 ---
    function stepShift(delta) {
      state.shiftOffset += delta;
      renderWatchView(delta > 0 ? 'next' : 'prev');
    }

    function resetToLiveShift() {
      if (state.shiftOffset === 0) {
        syncFromCloud(true);
        return;
      }
      const dir = state.shiftOffset > 0 ? 'prev' : 'next';
      state.shiftOffset = 0;
      renderWatchView(dir);
    }

    function initWatchSwipe() {
      const root = document.getElementById('watch-root');
      let startX = 0, startY = 0, tracking = false;

      root.addEventListener('touchstart', e => {
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        tracking = true;
      }, { passive: true });

      root.addEventListener('touchend', e => {
        if (!tracking || e.changedTouches.length !== 1) return;
        tracking = false;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        // 水平滑動超過 32px 即切換更期（適合 Watch 窄螢幕）
        if (Math.abs(dx) > 32 && Math.abs(dx) > Math.abs(dy) * 1.2) {
          stepShift(dx < 0 ? 1 : -1); // 向左滑(-dx) -> 下一更(+1); 向右滑(+dx) -> 上一更(-1)
        }
      }, { passive: true });
    }

    // --- 與主系統 OnDuty 雲端資料庫同步 ---
    function loadLocalCache() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(WATCH_CACHE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed.weeks) state.weeks = parsed.weeks;
        if (parsed.al2026Rows) state.al2026Rows = parsed.al2026Rows;
        if (parsed.al2027Rows) state.al2027Rows = parsed.al2027Rows;
        if (parsed.puSubNotes) state.puSubNotes = parsed.puSubNotes;
        if (parsed.mealSwapsByDate) state.mealSwapsByDate = parsed.mealSwapsByDate;
      } catch (e) {}
    }

    async function syncFromCloud(manual = false) {
      const dot = document.getElementById('sync-dot');
      const label = document.getElementById('sync-label');
      if (manual) label.textContent = '☁ 同步中...';

      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 6000);
        const res = await fetch(CLOUD_DB_ENDPOINT, { method: 'GET', cache: 'no-store', signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const remote = await res.json();
        if (remote && remote.weeks) {
          state.weeks = remote.weeks;
          if (Array.isArray(remote.al2026Rows)) state.al2026Rows = remote.al2026Rows;
          if (Array.isArray(remote.al2027Rows)) state.al2027Rows = remote.al2027Rows;
          if (remote.puSubNotes) state.puSubNotes = remote.puSubNotes;
          if (remote.mealSwapsByDate) state.mealSwapsByDate = remote.mealSwapsByDate;
          localStorage.setItem(WATCH_CACHE_KEY, JSON.stringify({
            weeks: state.weeks,
            al2026Rows: state.al2026Rows,
            al2027Rows: state.al2027Rows,
            puSubNotes: state.puSubNotes,
            mealSwapsByDate: state.mealSwapsByDate
          }));
        }
        dot.classList.remove('warn');
        const now = new Date();
        label.textContent = `☁ ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}已同步`;
        renderWatchView();
      } catch (e) {
        dot.classList.add('warn');
        label.textContent = '⚠ 離線快取';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadLocalCache();
      initWatchSwipe();
      renderWatchView();
      syncFromCloud(false);

      // 每 15 秒更新時間與食飯/返放工狀態，每 30 秒與雲端同步最新調更
      setInterval(() => renderWatchView(), 15000);
      setInterval(() => syncFromCloud(false), 30000);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          state.shiftOffset = 0; // 每次抬腕喚醒 Watch 自動回到實時當更
          renderWatchView();
          syncFromCloud(false);
        }
      });
    });
  </script>
</body>
</html>
